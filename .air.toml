root = "."
test_data_dir = "tmp"
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/rankinvite/"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "internal/db"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "migrations"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[proxy]
enabled = true
proxy_port = 8090
app_port = 8081

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
