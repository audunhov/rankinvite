<!DOCTYPE html>
<html>
<head>
    <title>Ny invitasjon - RankInvite</title>
    {{template "head" .}}
</head>
<body class="container">
    <header style="justify-content: flex-start;">
        <a href="/admin" class="back-link">← TILBAKE TIL DASHBOARD</a>
    </header>

    {{template "flash_messages" .}}

    <h1>NY INVITASJON</h1>
    <div class="card">
        <form action="/admin/invitations" method="POST">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            
            <div class="form-group">
                <label>Tittel på arrangementet</label>
                <input type="text" name="title" placeholder="f.eks. Styremøte i Oslo" required autofocus>
            </div>

            <div class="form-group">
                <label>Avsender</label>
                <select name="sender" required>
                    <optgroup label="Din personlige profil">
                        <option value="me">{{.AdminName}} <{{.CurrentEmail}}></option>
                    </optgroup>
                    {{if .SharedSenders}}
                    <optgroup label="Felles avsendere">
                        {{range .SharedSendersList}}
                        <option value="{{.}}">{{.}}</option>
                        {{end}}
                    </optgroup>
                    {{end}}
                    <optgroup label="System">
                        <option value="system">{{.GlobalSenderName}} <{{.GlobalSenderEmail}}></option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Sted</label>
                <input type="text" name="location" placeholder="f.eks. Marienlyst">
            </div>

            <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Starttidspunkt</label>
                    <input type="datetime-local" name="start_time">
                </div>
                <div class="form-group">
                    <label>Sluttidspunkt</label>
                    <input type="datetime-local" name="end_time">
                </div>
            </div>

            <div class="form-group">
                <label>Beskrivelse</label>
                <textarea name="description" rows="5" placeholder="Mer detaljer om arrangementet..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Antall tilgjengelige plasser</label>
                <input type="number" name="spots" value="1" min="1" required>
            </div>
            
            <button type="submit" class="button btn-primary" style="width: 100%; margin-top: 30px; font-size: 1.2em;">OPPRETT UTKAST</button>
        </form>
    </div>
</body>
</html>
