<!DOCTYPE html>
<html>
<head>
    <title>Rediger invitasjon - RankInvite</title>
    {{template "head" .}}
</head>
<body class="container">
    <header style="justify-content: flex-start;">
        <a href="/admin/invitations/{{.Invitation.ID}}" class="back-link">← TILBAKE TIL DETALJER</a>
    </header>

    {{template "flash_messages" .}}

    <h1>REDIGER INVITASJON</h1>
    <div class="card">
        <form action="/admin/invitations/update" method="POST">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <input type="hidden" name="id" value="{{.Invitation.ID}}">
            <div class="form-group">
                <label>Tittel på arrangementet</label>
                <input type="text" name="title" value="{{.Invitation.Title}}" required>
            </div>

            <div class="form-group">
                <label>Sted</label>
                <input type="text" name="location" value="{{.Invitation.Location}}">
            </div>

            <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Starttidspunkt</label>
                    <input type="datetime-local" name="start_time" value="{{if not .Invitation.StartTime.IsZero}}{{.Invitation.StartTime.Format "2006-01-02T15:04"}}{{end}}">
                </div>
                <div class="form-group">
                    <label>Sluttidspunkt</label>
                    <input type="datetime-local" name="end_time" value="{{if not .Invitation.EndTime.IsZero}}{{.Invitation.EndTime.Format "2006-01-02T15:04"}}{{end}}">
                </div>
            </div>

            <div class="form-group">
                <label>Beskrivelse</label>
                <textarea name="description" rows="5">{{.Invitation.Description}}</textarea>
            </div>
            
            <div class="form-group">
                <label>Antall tilgjengelige plasser</label>
                <input type="number" name="spots" value="{{.Invitation.Spots}}" min="1" required>
            </div>
            
            <button type="submit" class="button btn-primary" style="width: 100%; margin-top: 30px;">LAGRE ENDRINGER</button>
        </form>
    </div>
</body>
</html>
