<!DOCTYPE html>
<html>
<head>
    <title>Legg til strategi - Admin</title>
    {{template "head" .}}
</head>
<body class="container">
    <header style="justify-content: flex-start;">
        <a href="/admin/invitations/{{.Invitation.ID}}" class="back-link">← TILBAKE TIL INVITASJON</a>
    </header>

    <h1>Legg til strategi</h1>
    <div class="card">
        <form id="strategyForm" action="/admin/invitations/strategies" method="POST">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <input type="hidden" name="id" value="{{.Invitation.ID}}">
            
            <div class="form-group">
                <label>Type strategi</label>
                <select name="type" id="strategyType" onchange="toggleDuration()">
                    <option value="priority_list">Prioritert liste</option>
                    <option value="fcfs">Førstemann til mølla (FCFS)</option>
                </select>
            </div>

            <div id="durationGroup" class="form-group">
                <label id="durationLabel">Svarfrist per person</label>
                <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <select id="durationPresets" onchange="updateDurationFromPreset()">
                        <option value="60">1 time</option>
                        <option value="120">2 timer</option>
                        <option value="240">4 timer</option>
                        <option value="480">8 timer</option>
                        <option value="720">12 timer</option>
                        <option value="1440" selected>1 dag (24t)</option>
                        <option value="2880">2 dager (48t)</option>
                        <option value="4320">3 dager</option>
                        <option value="10080">1 uke</option>
                        <option value="custom">Egendefinert...</option>
                    </select>
                    <div id="customDurationGroup" style="display: none;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="number" id="customMins" value="1440" min="1" oninput="updateHiddenMins()">
                            <span style="font-size: 0.8em; font-weight: bold;">MINUTTER</span>
                        </div>
                    </div>
                </div>
                <input type="hidden" name="duration_mins" id="duration_mins_hidden" value="1440">
            </div>

            <div class="form-group">
                <label id="participantsLabel">Deltakere (dra og slipp for å prioritere)</label>
                <div id="participantList" style="margin-bottom: 24px;">
                    <!-- Participants will be added here -->
                </div>
                
                <div style="display: flex; gap: 20px;">
                    <input type="text" id="emailInput" list="pastEmails" placeholder="E-postadresse eller gruppe">
                    <datalist id="pastEmails">
                        {{range $name, $members := .Groups}}<option value="{{$name}}">{{end}}
                        {{range .PastEmails}}<option value="{{.}}">{{end}}
                    </datalist>
                    <button type="button" class="button" onclick="addParticipant()">LEGG TIL</button>
                </div>
            </div>

            <input type="hidden" name="participants_json" id="participantsJson">
            <button type="submit" class="button btn-primary" style="width: 100%; margin-top: 40px; font-size: 1.2em;">LAGRE STRATEGI</button>
        </form>
    </div>

    <script>
        const serverGroups = {
            {{range $name, $members := .Groups}}
            "{{$name}}": [{{range $i, $member := $members}}{{if $i}}, {{end}}"{{$member}}"{{end}}],
            {{end}}
        };

        const participantList = document.getElementById('participantList');
        const participants = [];

        function addParticipant() {
            const input = document.getElementById('emailInput');
            const value = input.value.trim();
            if (!value) return;

            if (serverGroups[value]) {
                serverGroups[value].forEach(email => {
                    if (!participants.includes(email)) {
                        participants.push(email);
                    }
                });
            } else {
                if (!participants.includes(value)) {
                    participants.push(value);
                }
            }

            renderList();
            input.value = '';
            input.focus();
        }

        function removeParticipant(email) {
            const index = participants.indexOf(email);
            if (index > -1) {
                participants.splice(index, 1);
                renderList();
            }
        }

        function renderList() {
            const type = document.getElementById('strategyType').value;
            participantList.innerHTML = '';
            participants.forEach((email, index) => {
                const item = document.createElement('div');
                item.className = 'participant-item';
                item.draggable = (type === 'priority_list');
                
                let content = '';
                if (type === 'priority_list') {
                    content += '<span style="margin-right: 15px; font-size: 1.2em; cursor: move;">☰</span>';
                } else {
                    content += '<span style="margin-right: 15px; font-size: 1.2em; opacity: 0.3;">•</span>';
                }
                
                content += '<span style="font-weight: bold;">' + email + '</span>' +
                           '<button type="button" class="remove-btn" onclick="removeParticipant(\'' + email + '\')">Fjern</button>';
                
                item.innerHTML = content;
                
                if (type === 'priority_list') {
                    item.addEventListener('dragstart', () => item.classList.add('dragging'));
                    item.addEventListener('dragend', () => item.classList.remove('dragging'));
                }
                participantList.appendChild(item);
            });
            updateJson();
        }

        participantList.addEventListener('dragover', e => {
            const type = document.getElementById('strategyType').value;
            if (type !== 'priority_list') return;
            
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            const afterElement = getDragAfterElement(participantList, e.clientY);
            if (afterElement == null) {
                participantList.appendChild(draggingItem);
            } else {
                participantList.insertBefore(draggingItem, afterElement);
            }
        });

        participantList.addEventListener('drop', e => {
            const type = document.getElementById('strategyType').value;
            if (type !== 'priority_list') return;

            const items = [...participantList.querySelectorAll('.participant-item')];
            participants.length = 0;
            items.forEach(item => {
                participants.push(item.querySelector('span:nth-child(2)').innerText);
            });
            updateJson();
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.participant-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateJson() {
            document.getElementById('participantsJson').value = JSON.stringify(participants);
        }

        function updateDurationFromPreset() {
            const preset = document.getElementById('durationPresets').value;
            const customGroup = document.getElementById('customDurationGroup');
            const hiddenInput = document.getElementById('duration_mins_hidden');
            const customInput = document.getElementById('customMins');

            if (preset === 'custom') {
                customGroup.style.display = 'block';
                hiddenInput.value = customInput.value;
            } else {
                customGroup.style.display = 'none';
                hiddenInput.value = preset;
                customInput.value = preset;
            }
        }

        function updateHiddenMins() {
            const customInput = document.getElementById('customMins');
            const hiddenInput = document.getElementById('duration_mins_hidden');
            hiddenInput.value = customInput.value;
        }

        function toggleDuration() {
            const type = document.getElementById('strategyType').value;
            const durationLabel = document.getElementById('durationLabel');
            const participantsLabel = document.getElementById('participantsLabel');
            
            durationLabel.innerText = type === 'priority_list' ? 'Svarfrist per person' : 'Total tidsfrist for runden';
            participantsLabel.innerText = type === 'priority_list' ? 'Deltakere (dra og slipp for å prioritere)' : 'Deltakere (rekkefølge har ingen betydning)';
            
            renderList();
        }

        document.getElementById('emailInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addParticipant();
            }
        });
    </script>
</body>
</html>
