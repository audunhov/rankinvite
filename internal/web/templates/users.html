<!DOCTYPE html>
<html>
<head>
    <title>Brukeradministrasjon - RankInvite</title>
    {{template "head" .}}
</head>
<body class="container">
    <header style="justify-content: flex-start;">
        <a href="/admin" class="back-link">← TILBAKE TIL DASHBOARD</a>
    </header>

    {{template "flash_messages" .}}

    <h1>Brukeradministrasjon</h1>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
        <div class="card">
            <h2>Eksisterende administratorer</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>E-post</th>
                        <th>Handling</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Admins}}
                    <tr>
                        <td style="font-weight: bold;">
                            {{.Email}}
                            {{if eq .Email $.CurrentEmail}} <span style="font-size: 0.7em; background: #eee; padding: 2px 6px; border: 1px solid black;">DEG</span>{{end}}
                        </td>
                        <td>
                            {{if ne .Email $.CurrentEmail}}
                            <form action="/admin/users/delete" method="POST" style="margin: 0;">
                                <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                                <input type="hidden" name="id" value="{{.ID}}">
                                <button type="submit" class="button btn-danger" style="padding: 4px 12px; font-size: 0.7em;" onclick="return confirm('Er du sikker på at du vil slette denne administratoren?')">SLETT</button>
                            </form>
                            {{else}}
                            -
                            {{end}}
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Opprett ny admin</h2>
            <form action="/admin/users/create" method="POST">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="form-group">
                    <label>E-post</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="button btn-primary" style="width: 100%;">OPPRETT BRUKER</button>
            </form>
        </div>
    </div>
</body>
</html>
